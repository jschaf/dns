name: lint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run
        uses: golangci/golangci-lint-action@v8
        with:
          version: v1.64
